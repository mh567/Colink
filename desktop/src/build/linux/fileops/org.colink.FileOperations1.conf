<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.colink.FileOperations1"/>
    <allow send_destination="org.colink.FileOperations1" send_interface="org.colink.FileOperations1"/>
  </policy>
  <policy user="colink-fileops">
    <allow own="org.colink.FileOperations1"/>
  </policy>
</busconfig>
