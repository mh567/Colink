version: "3"

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      GTK3_TAGS:
        sh: if pkg-config --exists gtk4 && pkg-config --exists webkitgtk-6.0; then echo ""; else echo "gtk3 webkit238"; fi
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}{{if .GTK3_TAGS}}-tags "production {{.GTK3_TAGS}}"{{else}}-tags production{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{else}}{{if .GTK3_TAGS}}-tags "{{.GTK3_TAGS}}" {{end}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: "{{.ARCH | default ARCH}}"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
      PKG_CONFIG_PATH:
        sh: if [ -n "{{.GTK3_TAGS}}" ]; then echo "$(pwd)/build/linux/pkgconfig"; fi

  package:
    summary: Packages the desktop and managed file service for Linux
    cmds:
      - task: stage:portable
        vars:
          PORTABLE_ZIP: "{{.PORTABLE_ZIP}}"
      - task: build
        vars:
          PRODUCTION: "true"
      - task: stage:fileops
      - rm -f {{.ARCHIVE}} bundled/portable.zip
      - tar -C {{.BIN_DIR}} -czf {{.ARCHIVE}} {{.APP_NAME}} fileops
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      VERSION: '{{.VERSION | default "dev"}}'
      PORTABLE_ZIP: '{{.PORTABLE_ZIP | default (printf "../portable/release/Octop-portable-linux-%s-%s.zip" .ARCH .VERSION)}}'
      ARCHIVE: '{{.BIN_DIR}}/{{.APP_NAME}}-desktop-linux-{{.ARCH}}-{{.VERSION}}.tar.gz'

  stage:fileops:
    cmds:
      - mkdir -p "{{.BIN_DIR}}/fileops"
      - go build -trimpath -buildvcs=false -ldflags="-w -s" -o "{{.BIN_DIR}}/fileops/colink-fileopsd" ./cmd/fileopsd
      - install -m 0755 build/linux/fileops/install.sh "{{.BIN_DIR}}/fileops/install.sh"
      - install -m 0644 build/linux/fileops/colink-fileops.service build/linux/fileops/org.colink.FileOperations1.conf build/linux/fileops/org.colink.fileops.policy "{{.BIN_DIR}}/fileops/"
    env:
      GOOS: linux
      GOARCH: "{{.ARCH | default ARCH}}"
      CGO_ENABLED: 0

  stage:portable:
    summary: Copies the matching green zip for go:embed
    cmds:
      - test -f {{.PORTABLE_ZIP}}
      - mkdir -p bundled
      - cp {{.PORTABLE_ZIP}} bundled/portable.zip
    vars:
      PORTABLE_ZIP: '{{.PORTABLE_ZIP | default (printf "../portable/release/Octop-portable-linux-%s-%s.zip" (.ARCH | default ARCH) (.VERSION | default "dev"))}}'

  run:
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}"
