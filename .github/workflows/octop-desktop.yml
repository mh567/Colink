name: Colink Desktop Package

# 正式发版：Auto Tag 在打 v* 后与 Release / Docker Publish 一并 dispatch。
# 产物 upsert 到同一 GitHub Release，再上传到 COS octop/release/<version>/。
# 手工补包：workflow_dispatch + release_tag（不必跑在 v* ref 上）。
# attach_from_run 只挂已有 artifact、不重打。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated plats, or 'all'"
        required: true
        default: "all"
        type: string
      attach_release:
        description: "Upload artifacts to a GitHub Release (v* ref, or pass release_tag)"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "GitHub Release tag to attach to (e.g. v0.9.31). Used when not running on a v* ref."
        required: false
        default: ""
        type: string
      attach_from_run:
        description: "Existing workflow run ID — attach its portable and desktop artifacts and skip the 6-platform rebuild"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Builds on the same ref cancel each other. Attach-only runs use a different
# group so they cannot cancel an in-flight package.
concurrency:
  group: >-
    green-portable-${{
      github.event.inputs.attach_from_run != '' && 'attach' || 'build'
    }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.attach_from_run == '' }}

env:
  # Prefer GitHub upstream on Actions runners (npmmirror is for CN local builds).
  PBS_BASE_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20251209
  PBS_TAG: "20251209"
  PBS_PY: "3.12.12"

jobs:
  frontend:
    name: Build dashboard
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.attach_from_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build frontend → src/octop/dashboard
        run: make build-frontend

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: src/octop/dashboard/
          if-no-files-found: error
          retention-days: 7

  # Filter before expanding the matrix so only selected runners start.
  select-platforms:
    name: Select platforms
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.attach_from_run == ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os

          all_plats = [
              {"plat": "linux-amd64", "arch": "amd64", "os": "ubuntu-latest"},
              {"plat": "linux-arm64", "arch": "arm64", "os": "ubuntu-24.04-arm"},
              {"plat": "darwin-arm64", "arch": "arm64", "os": "macos-15"},
              {"plat": "darwin-amd64", "arch": "amd64", "os": "macos-15-intel"},
              {"plat": "windows-amd64", "arch": "amd64", "os": "windows-latest"},
              {"plat": "windows-arm64", "arch": "arm64", "os": "windows-11-arm"},
          ]
          sel = os.environ["PLATFORMS"].lower().replace(" ", "")
          known = {row["plat"] for row in all_plats}
          if sel == "all":
              include = all_plats
          else:
              wanted = {part for part in sel.split(",") if part}
              unknown = wanted - known
              if unknown:
                  raise SystemExit(f"unknown platform(s): {', '.join(sorted(unknown))}")
              include = [row for row in all_plats if row["plat"] in wanted]
          if not include:
              raise SystemExit(f"no platforms selected: {sel}")
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={matrix}\n")
          print(matrix)
          PY

  package:
    name: "${{ matrix.plat }}"
    needs: [frontend, select-platforms]
    runs-on: ${{ matrix.os }}
    # Matrix runners are native for each plat; pin host detection so x64 Git Bash
    # on windows-11-arm does not mis-classify the job as windows-amd64 cross-build.
    env:
      GREEN_HOST_PLAT: ${{ matrix.plat }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Read package version
        run: |
          set -euo pipefail
          VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -1)
          echo "OCTOP_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "version=${VER}"

      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: src/octop/dashboard

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      # GitHub Cache outages must not fail the build — PBS download is cheap enough.
      - name: Cache python-build-standalone downloads
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: green/.cache
          key: pbs-${{ env.PBS_TAG }}-${{ env.PBS_PY }}-${{ matrix.plat }}

      - name: Bootstrap portable CPython
        env:
          GREEN_HOST_PLAT: ${{ matrix.plat }}
        run: bash desktop/portable/bootstrap-runtime.sh "${{ matrix.plat }}"

      - name: Assemble green zip
        env:
          GREEN_HOST_PLAT: ${{ matrix.plat }}
        run: |
          set -euo pipefail
          echo "GREEN_HOST_PLAT=${GREEN_HOST_PLAT} RUNNER_ARCH=${RUNNER_ARCH:-} uname=$(uname -ms)"
          bash desktop/portable/package.sh "${{ matrix.plat }}"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/src/package-lock.json

      - name: Verify and package Electron with bundled portable runtime
        run: bash desktop/package-release.sh "${{ matrix.plat }}" --reuse-portable

      # archive: false — upload the prebuilt zip as-is. Default archive=true would
      # wrap it again, so Actions UI / "Download artifact" becomes zip-in-zip.
      # With archive:false, artifact name is the filename (name: is ignored).
      - uses: actions/upload-artifact@v7
        with:
          path: desktop/portable/release/Octop-portable-${{ matrix.plat }}-${{ env.OCTOP_VERSION }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundled desktop package
        uses: actions/upload-artifact@v7
        with:
          path: desktop/src/release/Colink-desktop-${{ matrix.plat }}-${{ env.OCTOP_VERSION }}.*
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach zips to GitHub Release
    needs: package
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    # always(): still run when package was skipped (attach_from_run rebuild skip).
    if: >-
      always() &&
      !cancelled() &&
      (needs.package.result == 'success' || needs.package.result == 'skipped') &&
      (
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.attach_from_run != '') ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.attach_release == 'true' &&
         github.event.inputs.release_tag != '') ||
        (startsWith(github.ref, 'refs/tags/v') &&
         (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           github.event.inputs.attach_release == 'true')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve release tag
        id: rel
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          if [[ -z "$tag" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ "$tag" != v* ]]; then
            echo "Need a v* tag (run on a version tag, or pass release_tag)." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # v8 required for archive:false artifacts. skip-decompress keeps the
      # uploaded .zip / .tar.gz / .dmg / .exe intact — default unzip turns portable
      # zips into directories, so files: release-assets/* would skip them.
      - uses: actions/download-artifact@v8
        with:
          pattern: Octop-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.attach_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          pattern: Colink-desktop-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.attach_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List release assets
        run: |
          set -euo pipefail
          ls -lh release-assets/
          if find release-assets -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "Download extracted archives into directories; refuse incomplete attach." >&2
            find release-assets -mindepth 1 -maxdepth 1 -print
            exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
          # Upsert: works whether Release workflow already created the release.
          generate_release_notes: false

  upload-cos:
    name: Upload desktop packages to COS
    needs: release
    # attach_from_run skips the package jobs. A plain success check then skips
    # this reusable workflow even after the release job itself succeeded.
    if: ${{ always() && needs.release.result == 'success' }}
    uses: ./.github/workflows/upload-release-cos.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      patterns: "Colink-desktop-*,Octop-desktop-*,Octop-portable-*"
    secrets:
      RELEASE_COS_SECRET_ID: ${{ secrets.RELEASE_COS_SECRET_ID }}
      RELEASE_COS_SECRET_KEY: ${{ secrets.RELEASE_COS_SECRET_KEY }}
      RELEASE_COS_BUCKET: ${{ secrets.RELEASE_COS_BUCKET }}
      RELEASE_COS_REGION: ${{ secrets.RELEASE_COS_REGION }}
      RELEASE_COS_ENDPOINT: ${{ secrets.RELEASE_COS_ENDPOINT }}
